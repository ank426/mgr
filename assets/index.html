<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{title}</title>
    <style>
      html {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      body {
        margin: 0;
        background: black;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      #pages {
        width: var(--viewer-zoom, 100%);
        flex: 0 0 auto;
      }
      .page-slot {
        width: 100%;
        background: black;
      }
      .page-slot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main id="pages"></main>
    <script>
      window.MGR_CONFIG = {
        volumes: {volumes},
        prefetch: {prefetch},
      };
    </script>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
