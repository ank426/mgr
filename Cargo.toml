[package]
name = "mgr"
version = "0.1.0"
edition = "2024"

[dependencies]
alphanumeric-sort = "1.5.5"
clap = { version = "4.5.60", features = ["derive"] }
imagesize = "0.14.0"
indicatif = "0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.7"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
thiserror = "2.0.16"
warp = { version = "0.4.2", features = ["server"] }
zip = "8.1.0"
