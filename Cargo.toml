[package]
name = "mgr"
version = "0.1.0"
edition = "2024"

[dependencies]
alphanumeric-sort = "1.5.5"
clap = { version = "4.6.0", features = ["derive"] }
percent-encoding = "2.3.2"
rayon = "1.11"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1"
tikv-jemallocator = "0.6.1"
tokio = { version = "1.50.0", features = ["fs", "macros", "rt-multi-thread", "signal"] }
toml = "0.9.12"
warp = { version = "0.4.2", features = ["server"] }
zip = "8.4.0"
open = "5.3.3"
