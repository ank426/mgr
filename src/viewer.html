<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{title}</title>
    <style>
      html {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      body {
        margin: 0;
        background: black;
      }
      main {
        overflow-anchor: none;
      }
      img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="top-spacer" aria-hidden="true"></div>
      <section id="pages"></section>
      <div id="bottom-spacer" aria-hidden="true"></div>
    </main>
    <script>
      window.MGR_CONFIG = {
        pageCount: {page_count},
        prefetchBack: {prefetch_back},
        prefetchForward: {prefetch_forward},
      };
      {viewer_script}
    </script>
  </body>
</html>
