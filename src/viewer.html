<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{title}</title>
    <style>
      :root {
          color-scheme: dark;
      }
      html {
          scrollbar-width: none;
      }
      body {
          margin: 0;
          background: #0e0e0e;
          color: #f6f6f6;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
          scrollbar-width: none;
          -ms-overflow-style: none;
      }
      body::-webkit-scrollbar {
          display: none;
      }
      main {
          width: 100%;
          overflow-anchor: none;
      }
      #pages {
          width: 100%;
          overflow-anchor: none;
      }
      .spacer {
          width: 100%;
          height: 0;
      }
      img {
          display: block;
          width: 100%;
          height: auto;
          margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="top-spacer" class="spacer" aria-hidden="true"></div>
      <section id="pages"></section>
      <div id="bottom-spacer" class="spacer" aria-hidden="true"></div>
    </main>
    <script>
      window.MGR_CONFIG = {
        pageCount: {page_count},
        prefetchBack: {prefetch_back},
        prefetchForward: {prefetch_forward},
      };
    </script>
    <script src="/static/viewer.js?v=7"></script>
  </body>
</html>
